name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/test_unit.py -q --tb=short
      # Image baselines are sensitive to FreeType/OS; keep them on one Linux
      # Python so macOS-generated PNGs are not compared across every matrix cell.
      - name: Visual tests
        if: matrix.python-version == '3.12'
        run: pytest tests/test_visual.py -q --tb=short
      - name: Upload image diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mpl-results-${{ matrix.python-version }}
          path: /tmp/pytest-mpl-*
          if-no-files-found: ignore
